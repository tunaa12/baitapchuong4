<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#f6ead9"/>
      <stop offset="100%" stop-color="#ead9bf"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="250" cy="250" r="230" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="#6b4226" stroke-width="6"/>
  <circle cx="250" cy="250" r="205" fill="none" stroke="#6b4226" stroke-width="2"/>

  <!-- Coffee cup -->
  <g transform="translate(250,195)">
    <!-- steam -->
    <path d="M -28 -78 C -38 -95, -18 -100, -28 -118" stroke="#6b4226" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M 0 -82 C -10 -99, 10 -104, 0 -122" stroke="#6b4226" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M 28 -78 C 18 -95, 38 -100, 28 -118" stroke="#6b4226" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.65"/>

    <!-- saucer -->
    <ellipse cx="0" cy="72" rx="95" ry="14" fill="#6b4226"/>
    <ellipse cx="0" cy="69" rx="95" ry="14" fill="#a5673f"/>

    <!-- cup body -->
    <path d="M -70 -30 L -60 45 C -58 60, 58 60, 60 45 L 70 -30 Z" fill="#a5673f" stroke="#6b4226" stroke-width="6" stroke-linejoin="round"/>

    <!-- coffee surface -->
    <ellipse cx="0" cy="-30" rx="70" ry="16" fill="#6b4226"/>
    <ellipse cx="0" cy="-33" rx="70" ry="16" fill="#4a2c17"/>

    <!-- handle -->
    <path d="M 68 -8 C 110 -8, 110 42, 68 38" fill="none" stroke="#6b4226" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Text: THE HUB -->
  <text x="250" y="345" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" letter-spacing="4" fill="#4a2c17" font-weight="bold">THE HUB</text>

  <!-- divider -->
  <line x1="175" y1="365" x2="325" y2="365" stroke="#a5673f" stroke-width="2"/>

  <!-- Text: COFFEE -->
  <text x="250" y="395" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="10" fill="#6b4226">COFFEE</text>
</svg>
